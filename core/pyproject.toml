[project]
name = "chomik-core"
version = "1.0.0"
description = "Shared ChomikBox SOAP client for chomikuj.pl: auth, folder tree, download, upload, streaming relay."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chomik_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real chomikuj.pl API (needs CHOMIK_USER / CHOMIK_PASSWORD)"]
addopts = "-m 'not live'"

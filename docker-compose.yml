services:
  chomik-mcp:
    build: .
    ports:
      - "8765:8765"
    env_file: .env
    environment:
      - CHOMIK_DOWNLOAD_DIR=/data/downloads
      - CHOMIK_UPLOAD_DIR=/data/uploads
      - CHOMIK_STATE_DIR=/data/state
      - CHOMIK_PASSWORDS_FILE=/data/chomik-passwords.json
    volumes:
      - ./data:/data
    restart: unless-stopped

[project]
name = "chomik-mcp"
version = "1.0.0"
description = "Self-hostable MCP server for chomikuj.pl: browse, download, upload and clone between accounts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["chomik-core", "chomik-cloner", "mcp>=2.3,<3", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chomik-mcp = "chomik_mcp.__main__:main"

[tool.uv.sources]
chomik-core = { path = "../core", editable = true }
chomik-cloner = { path = "../cloner", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chomik_mcp"]

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "chomik-cloner"
version = "0.1.0"
description = "Clone a chomikuj.pl account (or someone's public folder) into another account you own."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["chomik-core"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chomik-clone = "chomik_cloner.cli:main"

[tool.uv.sources]
chomik-core = { path = "../core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chomik_cloner"]

[tool.hatch.metadata]
allow-direct-references = true
